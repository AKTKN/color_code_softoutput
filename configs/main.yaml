simulation:
  output_root: results
  shots: 100
  workers: 1
  master_seed: 20260927
  buffer_shots: 10
  verbose: true
chunking:
  calibration_shots: 10
  target_chunk_seconds: 4.0
  min_chunk_shots: 1
  max_chunk_shots: 10
  throughput_ema_alpha: 0.5
sweep:
  distance: [9, 11]
  physical_error_rate: [0.001]
  noise_model: uniform
  rounds: distance
  circuit_type: tri
  cnot_schedule: tri_optimal
color_code_options:
  temp_bdry_type: Z
decoders:
  # - type: concat_mwpm
  #   options:
  #     color_correlated_weight_basis: original_dem
  #   decode_options:
  #     colors: all

  # - type: concat_mwpm_stage2_base
  #   options:
  #     color_correlated_weight_basis: stage2
  #   decode_options:
  #     colors: all
  # - type: color_correlated
  #   options:
  #     enable_colorcorrelated_decoding: true
  #     remove_non_edge_like_errors: true
  #     color_correlated_b: 2.0

  - type: perturbation
    options:
      enable_prior_perturbation: true
      # M includes the unperturbed baseline member (member 0).
      perturbation_ensemble_size: 12
      perturbation_alpha: 1.0
      perturbation_seed: 20260927
      color_correlated_weight_basis: original_dem
      remove_non_edge_like_errors: true

  - type: tesseract
    options:
      pqlimit: 1000000
      det_beam: 20
      beam_climbing: true
      no_revisit_dets: true
      num_det_orders: 21
      det_order_method: Index
      seed: 2384753
      sparsify_errors: false