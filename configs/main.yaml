simulation:
  output_root: results/bitflip_swim
  shots: 100000
  workers: 6
  master_seed: 0
  buffer_shots: 5000
  verbose: true
chunking:
  calibration_shots: 10
  target_chunk_seconds: 4.0
  min_chunk_shots: 1
  max_chunk_shots: 5000
  throughput_ema_alpha: 0.5
sweep:
  distance: [5, 7, 9, 11, 13]
  physical_error_rate: [0.02, 0.04]
  noise_model: bitflip
  rounds: 1
  circuit_type: tri
  cnot_schedule: tri_optimal
color_code_options:
  temp_bdry_type: Z
decoders:
  - decoder_alias: concat_mwpm_comparative
    type: concat_mwpm
    # Comparative decoding writes logical_gap.parquet for ordinary concat MWPM.
    # This point is kept separate from SWIM scoring (the options cannot be
    # enabled together for one decoder point).
    options:
      comparative_decoding: true
      color_correlated_weight_basis: original_dem
    decode_options:
      colors: all
      compute_swim_distance: false

  - decoder_alias: concat_mwpm_swim
    type: concat_mwpm
    # Comparative decoding writes logical_gap.parquet for ordinary concat MWPM.
    # This point is kept separate from SWIM scoring (the options cannot be
    # enabled together for one decoder point).
    options:
      comparative_decoding: false
      color_correlated_weight_basis: original_dem
    decode_options:
      colors: all
      compute_swim_distance: true

