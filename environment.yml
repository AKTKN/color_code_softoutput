name: color_code_so
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      # Direct dependencies of the three local repositories, pinned to the
      # versions used in the working color_code_so environment (2026-09-27).
      - numpy==1.26.4
      - scipy==1.17.1
      - pandas==3.0.5
      - pyarrow==25.0.1
      - matplotlib==3.11.2
      - statsmodels==0.15.0
      - rsmf==0.2.1
      - stim==1.16.0
      - sinter==1.16.0
      - PyYAML==6.0.3
      - networkx==3.6.1
      - python-igraph==1.0.0
      - CairoSVG==2.9.1
      - rustworkx==0.18.1
      # PyMatching is built from source after the three repositories are cloned.
      # Its C++20 compiler must also be available on the cluster.
      - cmake==3.31.10
      - ninja==1.13.2
      - setuptools==83.0.0
      - wheel==0.47.0
      - pytest==9.1.1
      - ipykernel==7.3.0
      - nbformat==5.11.1
      - jupyter==1.1.1
      - sinter==1.16.0
