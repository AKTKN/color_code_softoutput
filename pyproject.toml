[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "color-code-softoutput"
version = "0.2.0"
description = "Paired color-code swim-distance numerical experiments"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<2", "pandas>=2.2", "pyarrow>=16", "matplotlib>=3.8", "statsmodels>=0.14", "scipy>=1.12", "rsmf>=0.2", "stim>=1.15", "PyYAML>=6", "ldpc>=2,<3"]

[project.optional-dependencies]
# Retain the historical extra name; BP support is now installed by default.
bp = []
test = ["pytest>=8", "nbformat>=5"]
notebook = ["ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["color_code_softoutput*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
